<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Finflow system context</title>
  <desc id="desc">Finance users reach the Finflow Next.js app on Vercel over HTTPS; the app uses Supabase Auth, Postgres, Storage and Realtime, calls per-organisation LLM providers, and is delivered from GitHub.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #475569; }
      .h { font-size: 14px; font-weight: 700; }
      .b { font-size: 12.5px; fill: #1e293b; }
      .m { font-size: 12px; fill: #475569; }
      .inv { fill: #ffffff; }
      .lbl { font-size: 12px; fill: #334155; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .edge { fill: none; stroke: #334155; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" rx="16" fill="#ffffff"/>
  <text x="40" y="40" class="title">Finflow — system context</text>
  <text x="40" y="62" class="sub">Who uses Finflow, where it runs, and what it depends on (as built on origin/main)</text>

  <!-- Actor -->
  <rect x="40" y="250" width="220" height="120" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="150" y="280" text-anchor="middle" class="h">Finance team</text>
  <text x="150" y="304" text-anchor="middle" class="b">Browser · React 19 UI</text>
  <text x="150" y="326" text-anchor="middle" class="m">roles: admin · analyst · reviewer</text>
  <text x="150" y="346" text-anchor="middle" class="m">one private workspace per signup</text>

  <!-- Vercel trust boundary -->
  <rect x="300" y="110" width="420" height="440" rx="14" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="316" y="134" class="h">Vercel · project finflow (Pro)</text>
  <text x="316" y="153" class="m">finfloww.xyz · Vercel DNS · www → apex (308)</text>
  <rect x="316" y="166" width="388" height="370" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <path d="M326 166 H694 A10 10 0 0 1 704 176 V198 H316 V176 A10 10 0 0 1 326 166 Z" fill="#000000"/>
  <text x="332" y="188" class="h inv">Next.js 15 App Router · Edge + Node runtimes</text>

  <rect x="330" y="210" width="360" height="54" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="344" y="232" class="h">Middleware</text>
  <text x="344" y="252" class="m">refresh Supabase session · /login redirect · API 401</text>
  <rect x="330" y="274" width="360" height="54" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="344" y="296" class="h">Pages (RSC + client components)</text>
  <text x="344" y="316" class="m">dashboard, workflows, data, investigations, settings</text>
  <rect x="330" y="338" width="360" height="54" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="344" y="360" class="h">Route handlers /api/** (25)</text>
  <text x="344" y="380" class="m">zod → requireOrgAccess → service-role client</text>
  <rect x="330" y="402" width="360" height="54" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="344" y="424" class="h">Background runs via waitUntil (≤ 300 s)</text>
  <text x="344" y="444" class="m">DAG orchestrator · investigator agent loop</text>
  <rect x="330" y="466" width="360" height="54" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="344" y="488" class="h">QuickJS WASM worker</text>
  <text x="344" y="508" class="m">model-written JS analysis: no fs, no network, 1.5 s CPU</text>

  <!-- Supabase trust boundary -->
  <rect x="840" y="110" width="320" height="440" rx="14" fill="none" stroke="#3ECF8E" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="856" y="134" class="h">Supabase · project finito</text>
  <text x="856" y="153" class="m">ref lveaycbnqnphgbszrogn · free tier</text>

  <rect x="856" y="170" width="288" height="78" rx="8" fill="#ecfdf5" stroke="#3ECF8E" stroke-width="1.5"/>
  <text x="870" y="192" class="h">Auth</text>
  <text x="870" y="212" class="m">email + password · JWT session cookies</text>
  <text x="870" y="231" class="m">site_url https://finfloww.xyz</text>
  <rect x="856" y="258" width="288" height="78" rx="8" fill="#ecfdf5" stroke="#3ECF8E" stroke-width="1.5"/>
  <text x="870" y="280" class="h">Postgres</text>
  <text x="870" y="300" class="m">20 tables · RLS · security-definer RPCs</text>
  <text x="870" y="319" class="m">append-only harness_events · GIN full-text</text>
  <rect x="856" y="346" width="288" height="78" rx="8" fill="#ecfdf5" stroke="#3ECF8E" stroke-width="1.5"/>
  <text x="870" y="368" class="h">Storage (private buckets)</text>
  <text x="870" y="388" class="m">workflow-files · analysis-sources</text>
  <text x="870" y="407" class="m">all writes through the server</text>
  <rect x="856" y="434" width="288" height="78" rx="8" fill="#ecfdf5" stroke="#3ECF8E" stroke-width="1.5"/>
  <text x="870" y="456" class="h">Realtime</text>
  <text x="870" y="476" class="m">postgres_changes on harness_events,</text>
  <text x="870" y="495" class="m">investigations (RLS-filtered)</text>

  <!-- External SaaS -->
  <rect x="40" y="600" width="220" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="54" y="626" class="h">GitHub · yash9657/finito</text>
  <text x="54" y="648" class="m">quality.yml: typecheck, lint,</text>
  <text x="54" y="666" class="m">test, build</text>
  <text x="54" y="686" class="m">supabase-migrations.yml</text>

  <rect x="316" y="600" width="388" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="332" y="626" class="h">LLM providers (resolved per org / step)</text>
  <text x="332" y="648" class="m">Fireworks (default) · Anthropic · OpenAI</text>
  <text x="332" y="666" class="m">Google Gemini · Ollama / OpenAI-compatible custom</text>
  <text x="332" y="686" class="m">org keys AES-256-GCM encrypted in Postgres</text>

  <!-- Legend -->
  <rect x="770" y="600" width="340" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="786" y="616" width="14" height="14" rx="3" fill="#000000"/>
  <text x="808" y="628" class="m">Vercel-managed</text>
  <rect x="940" y="616" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#3ECF8E" stroke-width="1.5"/>
  <text x="962" y="628" class="m">Supabase-managed</text>
  <rect x="786" y="644" width="14" height="14" rx="3" fill="#f8fafc" stroke="#64748b"/>
  <text x="808" y="656" class="m">Finflow code</text>
  <rect x="940" y="644" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="962" y="656" class="m">external SaaS</text>
  <line x1="786" y1="680" x2="826" y2="680" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="836" y="684" class="m">trust boundary</text>

  <!-- Edges -->
  <path class="edge" d="M260 310 H314"/>
  <text x="287" y="300" text-anchor="middle" class="lbl">HTTPS</text>

  <path class="edge" d="M150 250 V92 H1000 V168"/>
  <text x="575" y="86" text-anchor="middle" class="lbl">HTTPS sign-in (anon key) · WSS Realtime subscription</text>

  <path class="edge" d="M704 209 H854"/>
  <text x="779" y="203" text-anchor="middle" class="lbl">getUser (JWT)</text>
  <path class="edge" d="M704 297 H854"/>
  <text x="779" y="289" text-anchor="middle" class="lbl">PostgREST + RPC</text>
  <text x="779" y="316" text-anchor="middle" class="lbl">service-role key</text>
  <path class="edge" d="M704 385 H854"/>
  <text x="779" y="378" text-anchor="middle" class="lbl">Storage API</text>

  <path class="edge" d="M510 536 V598"/>
  <text x="520" y="572" class="lbl">HTTPS: JSON schema + tool calls</text>

  <path class="edge" d="M200 600 V470 H298"/>
  <text x="48" y="420" class="lbl">git push main → production</text>
  <text x="48" y="438" class="lbl">branch / PR → preview</text>

  <path class="edge" d="M150 700 V730 H1150 V552"/>
  <text x="640" y="722" text-anchor="middle" class="lbl">supabase db push (migrations 001–018, on merge to main)</text>
</svg>
